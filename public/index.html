<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StarKey</title><link rel="stylesheet" href="/style.css">
</head>
<body>
<header><div class="logo">StarKey</div><button id="adminBtn">Admin</button></header>
<main>
  <section class="card">
    <h1>获取专属密钥</h1>
    <p class="muted">输入你的 Roblox 用户名获取密钥。</p>
    <input id="username" placeholder="Roblox 用户名" maxlength="50">
    <input id="userid" placeholder="Roblox UserId（可选）" maxlength="30">
    <button class="primary" id="getKey">获取密钥</button>
    <div id="result" class="result hidden"></div>
    <p id="msg" class="msg"></p>
  </section>
</main>
<div id="adminModal" class="modal hidden">
 <div class="modalBox"><h2>Admin</h2><input id="adminPass" type="password" placeholder="管理员密码">
 <button class="primary" id="adminLogin">进入后台</button><button id="closeAdmin">取消</button><p id="adminMsg"></p></div>
</div>
<script src="/app.js"></script>
</body></html>
