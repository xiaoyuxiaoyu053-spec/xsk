<!doctype html> <html lang="zh-CN"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width, initial-scale=1"> <title>StarKey</title> <link rel="stylesheet" href="/style.css"> </head> <body> <!-- 顶部 --> <header class="topbar"> <div class="brand"> <span class="brand-star">★</span> <span>StarKey</span> </div> <button id="adminBtn" class="admin-btn" type="button" aria-label="Admin"> <span class="admin-icon">⚙</span> <span>Admin</span> </button> </header> <!-- 主内容 --> <main class="page"> <section class="card"> <div class="card-header"> <div class="title-icon">★</div> <h1>获取你的专属密钥</h1> <p class="muted"> 输入你的 Roblox 用户名获取专属密钥。 </p> </div> <!-- Roblox 用户 --> <div class="user-preview"> <div class="avatar-wrapper"> <img id="robloxAvatar" src="" alt="Roblox Avatar" class="avatar hidden" > <div id="avatarPlaceholder" class="avatar-placeholder"> <span>♙</span> </div> </div> <div class="user-info"> <strong id="displayUsername">等待输入用户名</strong> <span>Roblox 用户</span> </div> </div> <!-- 用户名 --> <label class="input-label" for="username"> Roblox 用户名 </label> <div class="input-wrap"> <span class="input-icon">♙</span> <input id="username" type="text" placeholder="输入 Roblox 用户名" maxlength="50" autocomplete="off" > </div> <!-- UserId --> <div class="optional-area"> <label class="input-label" for="userid"> Roblox UserId <span>可选</span> </label> <div class="input-wrap"> <span class="input-icon">#</span> <input id="userid" type="text" placeholder="如果知道 UserId，可以填写" maxlength="30" inputmode="numeric" > </div> </div> <!-- 获取按钮 --> <button class="primary get-key-btn" id="getKey" type="button" > <span class="btn-text">获取密钥</span> <span class="btn-arrow">→</span> </button> <!-- 普通提示 --> <p id="msg" class="msg"></p> <!-- Key 结果 --> <div id="result" class="result hidden"> <div class="success-title"> <span class="success-icon">✓</span> <span>密钥获取成功</span> </div> <div class="key-card"> <div class="key-label"> YOUR KEY </div> <div class="key-row"> <code id="keyValue">-</code> <button id="copyKey" class="copy-btn" type="button" > 复制 </button> </div> <div class="key-footer"> <span>有效期：15分钟</span> <span class="key-status">● 有效</span> </div> </div> </div> </section> </main> <!-- Admin 弹窗 --> <div id="adminModal" class="modal hidden"> <div class="modal-overlay"></div> <div class="modalBox"> <button id="closeAdmin" class="close-btn" type="button" aria-label="关闭" > × </button> <div class="admin-modal-icon"> ⚙ </div> <h2>Admin</h2> <p class="muted"> 输入管理员密码进入后台。 </p> <div class="input-wrap"> <span class="input-icon">🔒</span> <input id="adminPass" type="password" placeholder="管理员密码" autocomplete="off" > </div> <button class="primary admin-login-btn" id="adminLogin" type="button" > 进入后台 </button> <button id="closeAdminSecondary" class="secondary-btn" type="button" > 取消 </button> <p id="adminMsg" class="admin-msg"></p> </div> </div> <script src="/app.js"></script> </body> </html>
